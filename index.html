<!DOCTYPE html>
<html>
<head>
<title>Open WhatsApp</title>
</head>
<body>
<h2>WhatsApp Chat Opener</h2>

<input type="tel" id="number" placeholder="Enter Mobile Number">
<button onclick="openWhatsApp()">Open WhatsApp</button>

<script>
function openWhatsApp() {
  let number = document.getElementById("number").value.trim();

  if (number.length === 10) {
    number = "91" + number;
  }

  window.open("https://wa.me/" + number, "_blank");
}
</script>

</body>
</html>
